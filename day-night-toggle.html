<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Day / Night Toggle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#2c5f93;--ink:rgba(255,255,255,.88);--glow:rgba(255,255,255,.75);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2c5f93;--ink:rgba(255,255,255,.88);--glow:rgba(255,255,255,.75)}}
:root[data-theme="dark"]{--bg:#2c5f93;--ink:rgba(255,255,255,.88);--glow:rgba(255,255,255,.75)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow:hidden;
 background:linear-gradient(#4f86bd,#2c5f93);--cb:#b5d6f6;--cf:#fff}
.stage-night{--cb:#4a5fa3;--cf:#c9dcff}
.layer{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.nightbg{background:radial-gradient(ellipse at 50% 40%,#10173f,#04050f 75%)}
.stage-night .layer{opacity:1}
.pstar{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.shoot{position:absolute;width:90px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,rgba(255,255,255,0));opacity:0;animation:shoot 7s linear infinite}
.shoot::before{content:"";position:absolute;left:-1px;top:-1px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.8)}
@keyframes shoot{0%{opacity:0;transform:rotate(-30deg) translateX(0)}2%{opacity:1}9%{opacity:0;transform:rotate(-30deg) translateX(-420px)}100%{opacity:0;transform:rotate(-30deg) translateX(-420px)}}
@keyframes shootin{0%{opacity:0;transform:rotate(-30deg) translateX(0)}4%{opacity:1}20%{opacity:0;transform:rotate(-30deg) translateX(-90px)}100%{opacity:0;transform:rotate(-30deg) translateX(-90px)}}
main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:calc(var(--w)*.14);--w:min(460px,max(250px,58vw))}
.label{display:grid;color:var(--ink);font-weight:300;letter-spacing:.5em;text-transform:uppercase;font-size:clamp(.7rem,2.6vw,1rem);padding-left:.5em}
.label span{grid-area:1/1;text-align:center;transition:opacity 1.2s ease}
.label .n{opacity:0}.stage-night .label .n{opacity:1}.stage-night .label .d{opacity:0}
.switch{position:relative;width:var(--w);height:calc(var(--w)*.38);padding:0;border:0;background:none;border-radius:999px;cursor:pointer;-webkit-tap-highlight-color:transparent;
 box-shadow:0 0 0 2px rgba(255,255,255,.4),0 18px 40px rgba(0,0,0,.35);-webkit-box-reflect:below calc(var(--w)*.05) linear-gradient(transparent 55%,rgba(255,255,255,.22))}
.switch:focus-visible{outline:2px solid #fff;outline-offset:6px}
.sky{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.sky>*{position:absolute}
.sd,.sn{inset:0;transition:opacity 1.2s ease}
.sd{background:linear-gradient(#9ccbf1,#4f93d0)}
.sn{background:linear-gradient(#2b2f6e,#0d1030);opacity:0}.stage-night .sn{opacity:1}
.sun{left:76%;top:30%;width:11%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe58a,#f7c948);box-shadow:0 0 18px rgba(255,220,100,.7);transition:opacity 1.2s,transform 1.2s}
.stage-night .sun{opacity:0;transform:translateY(40%) scale(.6)}
.moon{left:7%;top:30%;width:14%;aspect-ratio:1;border-radius:50%;box-shadow:inset calc(var(--w)*-.03) calc(var(--w)*-.012) 0 0 #f7b52b;filter:drop-shadow(0 0 2px #8a5a00);transform:rotate(-25deg) translateY(40%);opacity:0;transition:opacity 1.2s,transform 1.2s}
.stage-night .moon{opacity:1;transform:rotate(-25deg)}
.ns{inset:0;opacity:0;transition:opacity 1.2s}.stage-night .ns{opacity:1}
.ns .tw{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}
.ns .shoot{width:34px;height:1.5px;top:24%;left:34%;animation:shootin 5s linear infinite}
.cl{left:-6%;bottom:0;width:112%;height:46%;transition:fill 1.2s ease,transform 1.2s ease}
.cl.b{fill:var(--cb)}.cl.f{fill:var(--cf);height:36%}
.stage-night .cl.b{transform:translateX(-4%)}.stage-night .cl.f{transform:translateX(3%)}
.knob{position:absolute;top:calc(var(--w)*.025);left:calc(var(--w)*.025);width:calc(var(--w)*.33);aspect-ratio:1;border-radius:50%;
 background:radial-gradient(circle at 36% 30%,#fff,#f4f6ff 65%,#dde3f4);box-shadow:0 0 calc(var(--w)*.07) calc(var(--w)*.012) var(--glow);transition:left .75s cubic-bezier(.6,0,.2,1)}
.stage-night .knob{left:calc(var(--w)*.645)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.ns .tw{opacity:.8}}
</style></head><body>
<div class="stage" id="stage">
 <div class="layer nightbg"></div>
 <div class="layer" id="ps"></div>
 <div class="layer"><i class="shoot" style="top:10%;left:82%"></i><i class="shoot" style="top:24%;left:94%;animation-delay:2.7s;animation-duration:8s"></i><i class="shoot" style="top:6%;left:55%;animation-delay:5.1s;animation-duration:9s"></i></div>
 <main>
  <div class="label" aria-live="polite"><span class="d">Day mode</span><span class="n">Night mode</span></div>
  <button class="switch" id="sw" role="switch" aria-checked="false" aria-label="Toggle day and night mode">
   <span class="sky">
    <i class="sd"></i><i class="sn"></i><i class="sun"></i><i class="moon"></i>
    <span class="ns"><i class="tw" style="left:30%;top:18%"></i><i class="tw" style="left:48%;top:12%;animation-delay:.6s"></i><i class="tw" style="left:62%;top:30%;animation-delay:1.1s"></i><i class="tw" style="left:80%;top:16%;animation-delay:1.7s"></i><i class="tw" style="left:20%;top:62%;animation-delay:.3s"></i><i class="shoot"></i></span>
    <svg class="cl b" viewBox="0 0 300 60" preserveAspectRatio="xMidYMax slice"><g><circle cx="18" cy="42" r="14"/><circle cx="44" cy="34" r="18"/><circle cx="78" cy="40" r="15"/><circle cx="110" cy="30" r="20"/><circle cx="148" cy="38" r="16"/><circle cx="182" cy="32" r="19"/><circle cx="216" cy="40" r="15"/><circle cx="250" cy="31" r="19"/><circle cx="284" cy="40" r="15"/><rect y="42" width="300" height="18"/></g></svg>
    <svg class="cl f" viewBox="0 0 300 60" preserveAspectRatio="xMidYMax slice"><g><circle cx="6" cy="48" r="12"/><circle cx="34" cy="46" r="14"/><circle cx="66" cy="50" r="10"/><circle cx="100" cy="44" r="13"/><circle cx="134" cy="49" r="11"/><circle cx="168" cy="43" r="15"/><circle cx="204" cy="49" r="11"/><circle cx="238" cy="45" r="14"/><circle cx="272" cy="49" r="12"/><rect y="50" width="300" height="10"/></g></svg>
   </span>
   <i class="knob"></i>
  </button>
 </main>
</div>
<script>
(function(){
var st=document.getElementById('stage'),sw=document.getElementById('sw'),ps=document.getElementById('ps');
for(var i=0;i<80;i++){var s=document.createElement('i'),z=1+Math.random()*1.6;s.className='pstar';s.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+z+'px;height:'+z+'px;animation-delay:'+(Math.random()*3)+'s;animation-duration:'+(2+Math.random()*3)+'s';ps.appendChild(s)}
sw.addEventListener('click',function(){var n=st.classList.toggle('stage-night');sw.setAttribute('aria-checked',n)});
})();
</script></body></html>
